# Trigger branch (known defect D9 / DEC-000-44): this used to be `main`, a branch the repository does not have, so the
# build-and-test workflow never ran and the code was built only on a release tag. It now runs on pushes to `master`,
# the default branch.
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        run: dotnet test --configuration Release --no-build