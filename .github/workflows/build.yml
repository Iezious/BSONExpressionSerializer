# Trigger branch (known defect D9 / DEC-000-44; fixed per DEC-001-9): this used to be `main`, a branch the repository does not have, so the
# build-and-test workflow never ran and the code was built only on a release tag. It now runs on pushes to `master`,
# the default branch.
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # SDK setup (DEC-001-10): the library and tests target net10.0, so the job installs the .NET 10 SDK instead of
      # relying on whatever SDK the runner image preinstalls.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        run: dotnet test --configuration Release --no-build